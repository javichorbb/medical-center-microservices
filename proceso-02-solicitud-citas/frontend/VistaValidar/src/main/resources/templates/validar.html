<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-4">

    <!-- Header azul -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Validación de Paciente</h4>
        </div>
        <div class="card-body">

            <form th:action="@{/validar}" method="post" class="row g-2 align-items-center">
                <div class="col-auto">
                    <label for="dni" class="col-form-label fw-semibold">DNI:</label>
                </div>
                <div class="col-sm-4">
                    <input type="text"
                           id="dni"
                           name="dni"
                           class="form-control"
                           placeholder="Ingrese su DNI"
                           maxlength="8"
                           pattern="[0-9]{8}"
                           title="El DNI debe tener 8 dígitos"
                           required />
                </div>

                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Validar</button>
                </div>
            </form>

        </div>
    </div>

    <!-- CASO ÉXITO -->
    <div th:if="${exito}">
        <div class="card shadow-sm border-success">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Paciente Validado</h5>
            </div>
            <div class="card-body">
                <table class="table table-bordered mb-3">
                    <tbody>
                        <tr>
                            <th style="width: 200px;">ID Paciente</th>
                            <td th:text="${paciente.idPaciente}"></td>
                        </tr>
                        <tr>
                            <th>Nombre</th>
                            <td class="fw-bold" th:text="${paciente.nombre}"></td>
                        </tr>
                        <tr>
                            <th>DNI</th>
                            <td th:text="${paciente.dni}"></td>
                        </tr>
                    </tbody>
                </table>

                <div class="alert alert-info mb-0">
                    Paciente verificado correctamente. Ya puede reservar una cita médica.
                </div>
            </div>
        </div>
    </div>

    <!-- CASO ERROR -->
    <div th:if="${exito == false}">
        <div class="alert alert-danger">
            No se encontró ningún paciente con el DNI
            <strong th:text="${dni}"></strong>.
            Verifique los datos e intente nuevamente.
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
