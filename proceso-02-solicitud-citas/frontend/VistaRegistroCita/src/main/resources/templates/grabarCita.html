<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registrar Cita MÃ©dica</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">

        <div class="container my-4">

            <!-- Header azul -->
            <div class="card mb-4 shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Registrar Cita MÃ©dica</h4>
                </div>
                <div class="card-body">

                    <form th:action="@{/grabar}" method="post" class="row g-3 align-items-end">

                        <div class="col-sm-5">
                            <label for="idHorario" class="form-label fw-semibold">ID Horario:</label>
                            <input type="number"
                                   id="idHorario"
                                   name="idHorario"
                                   class="form-control"
                                   placeholder="Ej: 1"
                                   min="1"
                                   required />
                        </div>

                        <div class="col-sm-5">
                            <label for="idPaciente" class="form-label fw-semibold">ID Paciente:</label>
                            <input type="number"
                                   id="idPaciente"
                                   name="idPaciente"
                                   class="form-control"
                                   placeholder="Ej: 1"
                                   min="1"
                                   required />
                        </div>

                        <div class="col-sm-2">
                            <button type="submit" class="btn btn-primary w-100">Registrar</button>
                        </div>

                    </form>

                </div>
            </div>

            <!-- CASO Ã‰XITO -->
            <div th:if="${exito}">
                <div class="card shadow-sm border-success">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Cita Registrada Correctamente</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-bordered mb-3">
                            <tbody>
                                <tr>
                                    <th style="width: 220px;">ID Cita</th>
                                    <td th:text="${cita.idCita}"></td>
                                </tr>
                                <tr>
                                    <th>ID Horario</th>
                                    <td th:text="${cita.idHorario}"></td>
                                </tr>
                                <tr>
                                    <th>ID Paciente</th>
                                    <td th:text="${cita.idPaciente}"></td>
                                </tr>
                                <tr>
                                    <th>Estado</th>
                                    <td>
                                        <span class="badge bg-success" th:text="${cita.estado}"></span>
                                    </td>
                                </tr>

                            </tbody>
                        </table>

                        <div class="alert alert-info mb-0">
                            Su cita ha sido registrada. Presente su DNI el dÃ­a de la atenciÃ³n.
                        </div>
                    </div>
                </div>
            </div>

            <!-- CASO ERROR -->
            <div th:if="${exito == false}">
                <div class="alert alert-danger">
                    No se pudo registrar la cita. Verifique los datos e intente nuevamente.
                </div>
            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
