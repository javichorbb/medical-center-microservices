<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historias Clínicas</title>
</head>
<body>
    <h2>Lista de Historias Clínicas</h2>
    <a th:href="@{/historia/verGrabar}">Registrar Nueva Historia</a> | 
    <a th:href="@{/historia/buscar}">Buscar por Paciente</a>
    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>ID Historia</th>
                <th>ID Paciente</th>
                <th>Fecha</th>
                <th>Diagnóstico</th>
                <th>Tratamiento</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="h : ${historias}">
                <td th:text="${h.idHistoria}"></td>
                <td th:text="${h.idPaciente}"></td>
                <td th:text="${h.fecha}"></td>
                <td th:text="${h.diagnostico}"></td>
                <td th:text="${h.tratamiento}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
