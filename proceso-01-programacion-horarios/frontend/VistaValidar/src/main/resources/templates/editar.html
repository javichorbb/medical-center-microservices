<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Editar Usuario</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Editar Usuario</h1>
        <form th:action="@{/actualizar/{id}(id=${usu.idUsu})}" th:object="${usu}" method="post">
            <label>Nombre:</label>
            <input type="text" th:field="*{nom}" required>
            <br><br>
            <label>Contraseña:</label>
            <input type="password" th:field="*{pas}" required>
            <br><br>
            <button type="submit">Actualizar</button>
        </form>
        <br>
        <a href="/listar">Volver a la lista</a>
    </body>
</html>
