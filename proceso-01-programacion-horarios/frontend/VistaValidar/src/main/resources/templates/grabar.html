<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Registrar Usuario</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Registrar Usuario</h1>
        <form th:action="@{/grabar}" th:object="${usu}" method="post">
            <label>Nombre:</label>
            <input type="text" th:field="*{nom}" required>
            <br><br>
            <label>Contraseña:</label>
            <input type="password" th:field="*{pas}" required>
            <br><br>
            <button type="submit">Grabar</button>
        </form>
        <br>
        <a href="/listar">Ver Lista de Usuarios</a>
    </body>
</html>
