<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Acceso al sistema</title>
</head>
<body>
    <h2>Ingreso al sistema de programación médica</h2>

    <form th:action="@{/validar}" th:object="${entrada}" method="post">
        <label>ID personal:</label>
        <input type="number" th:field="*{idPersonal}" required>

        <br><br>

        <label>Contraseña:</label>
        <input type="password" th:field="*{pas}" required>

        <br><br>

        <button type="submit">Ingresar</button>
    </form>

    <p th:text="${error}"></p>
</body>
</html>
