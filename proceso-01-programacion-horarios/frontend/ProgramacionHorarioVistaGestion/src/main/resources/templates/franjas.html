<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Gestión de Franjas Horarias</title>
    </head>
    <body>

        <h1>Gestión de Franjas Horarias</h1>

        <a th:href="@{/franja/nueva}">Registrar nueva franja</a>

        <br><br>

        <table border="1">
            <thead>
                <tr>
                    <th>ID Franja</th>
                    <th>ID Programación</th>
                    <th>Hora Inicio</th>
                    <th>Hora Fin</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="f : ${franjas}">
                    <td th:text="${f.idFranja}"></td>
                    <td th:text="${f.idProgramacion}"></td>
                    <td th:text="${f.horaInicio}"></td>
                    <td th:text="${f.horaFin}"></td>
                    <td>
                        <a th:href="@{/franja/editar/{id}(id=${f.idFranja})}">Editar</a>
                        |
                        <a th:href="@{/franja/eliminar/{id}(id=${f.idFranja})}"
                           onclick="return confirm('¿Eliminar esta franja?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <br>
        <a th:href="@{/inicio}">Volver al inicio</a>

    </body>
</html>
