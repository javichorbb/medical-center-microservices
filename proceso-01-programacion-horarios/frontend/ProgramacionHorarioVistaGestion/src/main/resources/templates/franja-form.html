<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Franja</title>
</head>
<body>

    <h1>Registrar / Editar Franja Horaria</h1>

    <form th:action="${franja.idFranja == null} ? @{/franja/grabar} : @{/franja/actualizar/{id}(id=${franja.idFranja})}"
          th:object="${franja}"
          method="post">

        <label>Programación:</label>
        <select th:field="*{idProgramacion}" required>
            <option value="">Seleccione una programación</option>
            <option th:each="p : ${programaciones}"
                    th:value="${p.idProgramacion}"
                    th:text="${'Programación ' + p.idProgramacion + ' - ' + p.fec}">
            </option>
        </select>

        <br><br>

        <label>Hora de inicio:</label>
        <input type="time" th:field="*{horaInicio}" required>

        <br><br>

        <label>Hora de fin:</label>
        <input type="time" th:field="*{horaFin}" required>

        <br><br>

        <button type="submit">Guardar</button>
    </form>

    <br>
    <a th:href="@{/franjas}">Volver</a>

</body>
</html>
