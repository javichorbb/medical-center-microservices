<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Registro de médicos</title>
    </head>
    <body>

        <h1>Formulario de médicos</h1>

        <!-- Formulario para registrar -->
        <form th:if="${medico.idMed == null}"
              th:action="@{/medicos/grabar}"
              th:object="${medico}"
              method="post">

            <label>Nombre:</label>
            <input type="text" th:field="*{nom}" required>
            <br><br>

            <label>Especialidad:</label>
            <input type="text" th:field="*{especialidad}" required>
            <br><br>

            <button type="submit">Guardar médico</button>
        </form>

        <!-- Formulario para actualizar -->
        <form th:unless="${medico.idMed == null}"
              th:action="@{/medicos/actualizar/{id}(id=${medico.idMed})}"
              th:object="${medico}"
              method="post">

            <label>ID:</label>
            <input type="text" th:field="*{idMed}" readonly>
            <br><br>

            <label>Nombre:</label>
            <input type="text" th:field="*{nom}" required>
            <br><br>

            <label>Especialidad:</label>
            <input type="text" th:field="*{especialidad}" required>
            <br><br>

            <button type="submit">Actualizar médico</button>
        </form>

        <br>
        <a th:href="@{/medicos}">Volver a la lista</a>

    </body>
</html>
